  - trigger
  - supporting
  - duplicate
  - noise
  - unrelated

simulation_types:
  - benign_baseline
  - benign_noise
  - manual_adversary_emulation
  - atomic_validation
  - caldera_campaign
  - simulated_only

execution_modes:
  - manual
  - atomic_red_team
  - caldera
  - simulated_only

confidence_values:
  - high
  - medium
  - low

quality_gate:
  required_before_execution:
    - scenario_id_or_campaign_id
    - run_id
    - host
    - execution_mode
    - tool
    - expected_local_signal
    - expected_wazuh_signal
    - mitre_mapping_or_na_justification
    - cleanup_steps
    - safety_rating
    - evidence_filenames
    - run_log_row
