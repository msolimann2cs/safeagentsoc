taxonomy_version: 0.2.0
phase: phase_02_scenario_dataset

execution_layers:
  L0:
    name: benign_baseline
    execution_mode: manual
  L1:
    name: noise_false_positive_like
    execution_mode: manual
  L2:
    name: manual_adversary_emulation
    execution_mode: manual
  L3:
    name: atomic_validation
    execution_mode: atomic_red_team
  L4:
    name: caldera_campaign_emulation
    execution_mode: caldera
  L5:
    name: simulated_only_high_risk_gap
    execution_mode: simulated_only

labels:
  - benign
  - noise
  - attack_like
  - ambiguous
  - false_positive_candidate
  - simulated_only

