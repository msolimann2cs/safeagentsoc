catalog_version: 0.1.0
phase: phase_02_scenario_dataset
status: design_only
execution_status: no_scenarios_executed_in_sprint_2

scenarios:
  - scenario_id: S01
    name: Windows PowerShell execution
    type: attack_like
    platform: Windows
    host: safesoc-win-01
    ground_truth_label: attack_like
    safety_rating: low
    mitre:
      - tactic: Execution
        technique_id: T1059.001
        technique_name: PowerShell
        confidence: high
    expected_local_signal:
      - PowerShell command output
      - Sysmon process creation event
      - marker file under C:\SafeAgentSOC-Phase2\S01
    expected_wazuh_query:
      - 'agent.name: "safesoc-win-01" and powershell'
      - 'agent.name: "safesoc-win-01" and data.win.system.providerName: "Microsoft-Windows-Sysmon"'
    cleanup:
      - 'Remove-Item -Recurse -Force C:\SafeAgentSOC-Phase2\S01'

  - scenario_id: S02
