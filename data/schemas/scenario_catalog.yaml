        technique_id: T1053.005
        technique_name: Scheduled Task
        confidence: medium
    expected_local_signal:
      - schtasks command output
      - scheduled task creation/query output
      - process telemetry for schtasks.exe
    expected_wazuh_query:
      - 'agent.name: "safesoc-win-01" and schtasks'
    cleanup:
      - 'schtasks /Delete /TN "SafeAgentSOC_S03_Marker" /F'
      - 'Remove-Item -Recurse -Force C:\SafeAgentSOC-Phase2\S03'

