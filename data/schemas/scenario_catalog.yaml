        technique_name: System Information Discovery
        confidence: high
      - tactic: Discovery
        technique_id: T1033
        technique_name: System Owner/User Discovery
        confidence: high
      - tactic: Discovery
        technique_id: T1016
        technique_name: System Network Configuration Discovery
        confidence: high
    expected_local_signal:
      - command output for whoami, hostname, ipconfig, systeminfo
      - process execution telemetry
    expected_wazuh_query:
      - 'agent.name: "safesoc-win-01" and whoami'
      - 'agent.name: "safesoc-win-01" and systeminfo'
    cleanup: []

  - scenario_id: S03
    name: Windows scheduled task marker
    type: attack_like
    platform: Windows
    host: safesoc-win-01
    ground_truth_label: attack_like
    safety_rating: medium
    mitre:
